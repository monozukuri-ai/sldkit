[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[project]
name = "sldkit"
version = "0.2.0"
description = "Source-faithful parsing foundations for SolidWorks files"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0 AND MIT AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
requires-python = ">=3.10"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" },
]
maintainers = [{ name = "UnRobotics Inc." }]
keywords = ["cad", "parser", "solidworks", "sldprt", "sldasm", "slddrw"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Licensing = "https://github.com/monozukuri-ai/sldkit/blob/main/docs/license.md"
Commercial = "https://www.un-robotics.com/#contact"
Homepage = "https://github.com/monozukuri-ai/sldkit"
Repository = "https://github.com/monozukuri-ai/sldkit"
Issues = "https://github.com/monozukuri-ai/sldkit/issues"
Documentation = "https://github.com/monozukuri-ai/sldkit/tree/main/docs"

[project.scripts]
sldkit = "sldkit.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "maturin>=1.11,<2",
    "pytest>=8.4,<10",
    "ruff>=0.8",
]

[tool.maturin]
manifest-path = "crates/sldkit-python/Cargo.toml"
python-source = "python"
module-name = "sldkit._core"
bindings = "pyo3"
include = [
    { path = "CONTRIBUTING.md", format = "sdist" },
    { path = "CLA.md", format = "sdist" },
    { path = "viewer/LICENSE.txt", format = "sdist" },
    { path = "scripts/README.md", format = "sdist" },
    { path = "scripts/smoke_wheel_artifact.py", format = "sdist" },
    { path = "scripts/smoke_installed_package.py", format = "sdist" },
    { path = "scripts/validate_geometry_oracle.py", format = "sdist" },
    { path = "scripts/test_assembly_capture.ps1", format = "sdist" },
    { path = "scripts/check_license.py", format = "sdist" },
    { path = "scripts/sync_license_notices.py", format = "sdist" },
    { path = "scripts/verify_release_artifacts.py", format = "sdist" },
    { path = "scripts/verify_release_version.py", format = "sdist" },
    { path = "docs/README.md", format = "sdist" },
    { path = "docs/architecture.md", format = "sdist" },
    { path = "docs/compatibility.md", format = "sdist" },
    { path = "docs/development/README.md", format = "sdist" },
    { path = "docs/development/assembly-validation.md", format = "sdist" },
    { path = "docs/development/drawing-validation.md", format = "sdist" },
    { path = "docs/development/geometry-validation.md", format = "sdist" },
    { path = "docs/development/part-validation.md", format = "sdist" },
    { path = "docs/development/releasing.md", format = "sdist" },
    { path = "docs/drawing-structure.md", format = "sdist" },
    { path = "docs/geometry.md", format = "sdist" },
    { path = "docs/license.ja.md", format = "sdist" },
    { path = "docs/license.md", format = "sdist" },
    { path = "docs/parser-provenance.md", format = "sdist" },
    { path = "docs/project-scanning.md", format = "sdist" },
    { path = "docs/schemas/drawing-ground-truth.schema.json", format = "sdist" },
    { path = "docs/schemas/geometry-oracle.schema.json", format = "sdist" },
    { path = "docs/schemas/nurbs-geometry-oracle.schema.json", format = "sdist" },
    { path = "docs/schemas/nurbs-trim-oracle.schema.json", format = "sdist" },
    { path = "docs/viewer.md", format = "sdist" },
    { path = "viewer/package.json", format = "sdist" },
    { path = "viewer/package-lock.json", format = "sdist" },
    { path = "viewer/build.mjs", format = "sdist" },
    { path = "viewer/src/**/*", format = "sdist" },
    { path = "python/sldkit/viewer/_assets/*", format = ["sdist", "wheel"] },
    { path = "scripts/capture_drawing_ground_truth.ps1", format = "sdist" },
    { path = "scripts/capture_assembly_transforms.ps1", format = "sdist" },
    { path = "scripts/compare_drawing_structures.py", format = "sdist" },
    { path = "scripts/capture_step_geometry.py", format = "sdist" },
    { path = "scripts/capture_part_orientation.swb", format = "sdist" },
    { path = "scripts/validate_part_orientation.py", format = "sdist" },
    { path = "scripts/validate_part_boundaries.py", format = "sdist" },
    { path = "scripts/validate_partial_nurbs.py", format = "sdist" },
    { path = "scripts/nurbs_geometry.py", format = "sdist" },
    { path = "scripts/validate_nurbs_geometry.py", format = "sdist" },
    { path = "scripts/validate_nurbs_trim.py", format = "sdist" },
]
exclude = [
    ".internal/**",
    "preview.html",
    "fuzz/**",
    "reference/**",
    "corpus/**",
    "designs/**",
    "viewer/node_modules/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".venv", "reference", "target"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
