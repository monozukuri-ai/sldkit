# Modified by sldkit; see PATCHES.md for source provenance and patch scope.
# Based on the normalized cadmpeg-codec-sldprt 0.5.3 registry manifest.

[package]
edition = "2021"
rust-version = "1.88"
name = "cadmpeg-codec-sldprt"
version = "0.5.3+sldkit.4"
publish = false
build = false
exclude = ["tests/golden/**"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Read and write SolidWorks .sldprt part geometry, metadata, and feature records."
homepage = "https://github.com/cadmpeg/cadmpeg"
documentation = "https://docs.rs/cadmpeg-codec-sldprt"
readme = "README.md"
keywords = [
    "cad",
    "solidworks",
    "sldprt",
    "parasolid",
    "geometry",
]
categories = [
    "encoding",
    "parser-implementations",
    "graphics",
]
license = "Apache-2.0"
repository = "https://github.com/cadmpeg/cadmpeg"

[features]
schema = [
    "dep:schemars",
    "cadmpeg-core/schema",
    "cadmpeg-ir/schema",
]

[lib]
name = "cadmpeg_codec_sldprt"
path = "src/lib.rs"

[dependencies.cadmpeg-container]
version = "0.5.3"

[dependencies.cadmpeg-core]
version = "0.5.3"

[dependencies.cadmpeg-ir]
version = "0.5.3"

[dependencies.crc32fast]
version = "1"

[dependencies.flate2]
version = "1"

[dependencies.rmp]
version = "=0.8.15"

[dependencies.roxmltree]
version = "0.21"

[dependencies.schemars]
version = "1.2"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"
features = [
    "float_roundtrip",
    "raw_value",
]

[dependencies.sha2]
version = "0.11"

[dependencies.thiserror]
version = "2"

[dev-dependencies.cadmpeg-ir]
version = "0.5.3"
features = ["examples"]

[lints.clippy]
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
dbg_macro = "warn"
disallowed_methods = "allow"
float_cmp = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
single_match_else = "allow"
todo = "warn"
too_many_lines = "allow"
unimplemented = "warn"
unwrap_used = "warn"

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
missing_docs = "warn"

[lints.rust.warnings]
level = "deny"
priority = -100

[dependencies.parasolid-core]
version = "=0.1.0"
